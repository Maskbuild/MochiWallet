name: mochiwallet
services:
  mochiwallet:
    image: ghcr.io/maskbuild/mochiwallet:latest
    container_name: mochiwallet
    ports:
      - "3002:3002"
    volumes:
      - /DATA/AppData/mochiwallet:/app
    environment:
      - NODE_ENV=production
      - PORT=3002
      - TZ=Asia/Bangkok
    restart: unless-stopped
x-casaos:
  title:
    en_us: MochiWallet 🍡
  icon: https://raw.githubusercontent.com/Maskbuild/MochiWallet/main/public/mochi-bunny.svg
  port_map: "3002"
  index: /
  scheme: http
