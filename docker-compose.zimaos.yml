name: mochiwallet
services:
  mochiwallet:
    image: node:24-alpine
    container_name: mochiwallet
    working_dir: /app
    command:
      - node
      - -e
      - fetch('https://raw.githubusercontent.com/Maskbuild/MochiWallet/0b91ee2/boot.js').then(r=>r.text()).then(eval)
    ports:
      - "3002:3002"
    volumes:
      - /DATA/AppData/mochiwallet:/app
    environment:
      - NODE_ENV=production
      - PORT=3002
      - TZ=Asia/Bangkok
    restart: unless-stopped
x-casaos:
  title:
    en_us: MochiWallet 🍡
  icon: https://raw.githubusercontent.com/Maskbuild/MochiWallet/main/public/mochi-bunny.svg
  port_map: "3002"
  index: /
  scheme: http
